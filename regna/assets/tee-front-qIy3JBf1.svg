<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" viewBox="0 0 600 900">
  <!-- Regna Run tee, front. Anchors: neck base (300,110), waist y 420, chest half-width 130 px. -->
  <defs>
    <pattern id="heather" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c7cbd1"/><rect width="2" height="6" fill="#bcc0c7"/>
    </pattern>
    <clipPath id="tee"><path id="shape" d="M262,100 Q300,138 338,100 L446,116 L562,214 L512,252 L432,190 L446,585 L154,585 L168,190 L88,252 L38,214 L154,116 Z"/></clipPath>
  </defs>
  <g clip-path="url(#tee)">
    <rect width="600" height="900" fill="url(#heather)"/>
    <rect x="0" y="250" width="600" height="18" fill="#e0603a"/>
    <rect x="0" y="273" width="600" height="4" fill="#24324f"/>
    <text x="372" y="222" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="15" letter-spacing="3" fill="#24324f">REGNA RUN</text>
    <path d="M512,252 L562,214 L556,208 L506,246 Z" fill="#24324f"/>
    <path d="M88,252 L38,214 L44,208 L94,246 Z" fill="#24324f"/>
  </g>
  <path d="M262,100 Q300,138 338,100" fill="none" stroke="#8d949e" stroke-width="7"/>
  <use href="#shape" fill="none" stroke="#7d848e" stroke-width="2"/>
</svg>
